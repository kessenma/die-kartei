name: Bug report
description: Something in the app isn't working the way it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you give, the faster it can be fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What went wrong?
      description: What were you doing, and what happened?
      placeholder: e.g. I tapped "Generate flashcards" and the app froze.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: App diagnostics
      description: >
        Auto-filled by the app when you tap "Report a bug". Please keep it — it
        helps with debugging. Feel free to edit or remove anything you'd rather
        not share.
    validations:
      required: false
