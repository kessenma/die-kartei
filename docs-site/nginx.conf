# nginx config for the static docs export (docs-site/out)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Coolify's proxy, keep redirects relative (no http://host:80/...)
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css text/markdown application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed Next.js assets never change
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Static search index generated at build time (file has no extension)
    location = /api/search {
        default_type application/json;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Raw markdown copies of each page (used by "Copy Markdown" / LLM tools)
    location /llms.mdx/ {
        default_type text/markdown;
        charset utf-8;
        try_files $uri =404;
    }

    location / {
        # /page/ -> /page/index.html ; /page -> /page/index.html ; /page.html
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
