# Transpiled to Kotlin so it can call Android's TextToSpeech directly; bridged so the native
# DieKartei module can call it.
skip:
  mode: 'transpiled'
  bridging: true
# DeckFiles.share hands a deck to other apps through androidx's FileProvider.
build:
  contents:
    - block: 'dependencies'
      contents:
        - 'implementation("androidx.core:core:1.16.0")'
